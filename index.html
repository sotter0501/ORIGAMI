<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ORIGAMI - 종이 조각의 세계</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111116;
            color: #ffffff;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* 1. 타이틀 영역: 빨간색 색종이 위에 올라간 스타일 (대형화) */
        #titleContainer {
            position: absolute;
            top: 36px;
            left: 36px;
            z-index: 1000;
            cursor: default;
        }

        .paper-title-card {
            position: relative;
            background: #E53935; /* 빨간색 색종이 */
            padding: 24px 36px 20px 36px;
            border-radius: 4px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5), 0 2px 4px rgba(0, 0, 0, 0.3);
            transform: rotate(-2deg); /* 약간 접히거나 놓인 듯한 감성적인 각도 */
            transition: transform 0.3s ease;
            display: inline-block;
        }

        .paper-title-card:hover {
            transform: rotate(0deg) scale(1.02);
        }

        /* 빨간색 색종이 우측 하단 접힘 효과 */
        .paper-title-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 24px 24px;
            border-color: transparent transparent #111116 #b71c1c;
        }

        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem; /* 훨씬 크게 확대 */
            font-weight: 900; /* 글자 굵기 대폭 강화 */
            letter-spacing: 0.08em;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.0;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.15rem; /* 서브타이틀 크기 확대 */
            color: #FFEBEE;
            font-weight: 800; /* 굵기 대폭 강화 */
            letter-spacing: -0.02em;
            margin-top: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* 2. '색종이 추가' 버튼: 노란 백조 모양 도형 위에 글자 연출 (대형화) */
        .origami-btn-wrapper {
            position: absolute;
            top: 36px;
            right: 48px;
            z-index: 1000;
        }

        button#addPaperBtn {
            position: relative;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button#addPaperBtn:hover {
            transform: translateY(-6px) scale(1.06) rotate(3deg);
        }

        button#addPaperBtn:active {
            transform: translateY(2px) scale(0.96);
        }

        /* 노란 백조 SVG 크기 대형화 */
        .swan-btn-svg {
            width: 210px;
            height: 210px;
            filter: drop-shadow(0 14px 20px rgba(0, 0, 0, 0.5));
            transition: filter 0.3s ease;
        }

        button#addPaperBtn:hover .swan-btn-svg {
            filter: drop-shadow(0 18px 28px rgba(255, 215, 0, 0.4));
        }

        /* 백조 도형 위에 올라가는 굵은 글씨 */
        .swan-btn-text {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.25rem; /* 글자 크기 확대 */
            font-weight: 900; /* 아주 굵은 글씨 */
            color: #3E2723; /* 노란색과 대비되는 짙은 색상 */
            letter-spacing: -0.03em;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        /* 3. 속도 조절 슬라이더 UI (하단 독립 배치) */
        #speedControl {
            position: absolute;
            bottom: 32px;
            left: 36px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 700;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 22px;
            border-radius: 30px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        #speedControl input[type="range"] {
            -webkit-appearance: none;
            width: 110px;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.25);
            outline: none;
            cursor: pointer;
        }

        #speedControl input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
            transition: transform 0.15s ease;
        }

        #speedControl input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        #speedVal {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            min-width: 36px;
            font-weight: 800;
        }

        /* 무대 영역 */
        #stage {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 종이 오브제 스타일 */
        .origami-item {
            position: absolute;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.6));
            will-change: transform, left, top;
            transition: filter 0.3s ease;
        }

        .origami-item:hover {
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.8));
        }

        /* 완성 및 정지 상태 고정 아우라 */
        .origami-item.paused {
            filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.18)) drop-shadow(0 15px 25px rgba(0, 0, 0, 0.6));
        }

        .origami-item svg {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 파티클 캔버스 */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- 빨간색 색종이 형태의 대형 타이틀 카드 -->
    <div id="titleContainer">
        <div class="paper-title-card">
            <div class="main-title">ORIGAMI</div>
            <div class="subtitle">✨ 종이를 클릭해 종이접기를 해 봅시다!</div>
        </div>
    </div>

    <!-- 노란 백조 모양 도형 위 색종이 추가 버튼 -->
    <div class="origami-btn-wrapper">
        <button id="addPaperBtn" title="새 색종이 만들기">
            <!-- 노란 백조 종이접기 SVG -->
            <svg class="swan-btn-svg" viewBox="0 0 120 120">
                <g>
                    <!-- 백조 머리 및 주둥이 -->
                    <polygon points="11,21 30,14 28,26" fill="#FFB300" opacity="0.85"/>
                    <polygon points="30,14 38,21 28,26" fill="#FFA000" opacity="0.95"/>
                    <!-- 목과 몸통 -->
                    <polygon points="28,26 38,21 38,95 31,95 12,68" fill="#FFD54F" opacity="1.0"/>
                    <polygon points="12,68 31,95 31,58" fill="#FFC107" opacity="0.8"/>
                    <!-- 날개 접힘 부분 -->
                    <polygon points="36,54 94,15 86,39" fill="#FFE082" opacity="0.95"/>
                    <polygon points="86,39 94,15 110,33 80,95" fill="#FFCA28" opacity="0.85"/>
                    <polygon points="33,57 94,15 81,96 40,96" fill="#FFD54F" opacity="1.0"/>
                    <!-- 꼬리 -->
                    <polygon points="81,96 118,50 85,95" fill="#FFC107" opacity="0.9"/>
                </g>
            </svg>
            <span class="swan-btn-text">＋ 색종이 추가</span>
        </button>
    </div>

    <!-- 속도 조절 슬라이더 UI (하단 독립 배치) -->
    <div id="speedControl">
        <span>흐름 속도</span>
        <input type="range" id="speedSlider" min="0.2" max="3" step="0.1" value="1">
        <span id="speedVal">1.0x</span>
    </div>

    <div id="stage"></div>
    <canvas id="particleCanvas"></canvas>

    <script>
        // ==========================================
        // 1. 변수 및 캔버스 설정
        // ==========================================
        const addPaperBtn = document.getElementById("addPaperBtn");
        const speedSlider = document.getElementById("speedSlider");
        const speedValDisplay = document.getElementById("speedVal");
        const stage = document.getElementById("stage");
        const canvas = document.getElementById("particleCanvas");
        const ctx = canvas.getContext("2d");

        let globalSpeedMultiplier = 1.0;
        let paperList = [];
        let particles = [];

        let mouse = { x: -9999, y: -9999, radius: 250 };

        const colorList = [
            "#FF5722", "#FFC107", "#8BC34A", "#00BCD4", 
            "#3F51B5", "#E91E63", "#9C27B0", "#009688", "#FF9800"
        ];

        const finalOrigamiTemplates = [
            // 물고기
            `<svg viewBox="0 0 120 120">
                <g>
                    <polygon points="35,27 61,10 50,28" fill="{c}" opacity="0.75"/>
                    <polygon points="8,57 33,28 49,30 44,41" fill="{c}" opacity="0.85"/>
                    <polygon points="33,28 50,28 73,50 44,41" fill="{c}" opacity="1.0"/>
                    <polygon points="8,59 44,41 52,84 36,88" fill="{c}" opacity="0.7"/>
                    <polygon points="44,41 73,50 74,66 52,84" fill="{c}" opacity="0.9"/>
                    <polygon points="37,89 53,85 66,115" fill="{c}" opacity="0.8"/>
                    <polygon points="75,51 110,33 75,58" fill="{c}" opacity="0.95"/>
                    <polygon points="75,60 112,84 75,67" fill="{c}" opacity="0.8"/>
                </g>
            </svg>`,
            // 나비
            `<svg viewBox="0 0 120 120">
                <g>
                    <polygon points="60,33 63,40 60,47 57,40" fill="{c}" opacity="1.0"/>
                    <polygon points="60,53 63,65 60,77 57,65" fill="{c}" opacity="1.0"/>
                    <polygon points="56,51 60,30 10,10 24,59" fill="{c}" opacity="0.95"/>
                    <polygon points="64,51 60,30 110,10 96,59" fill="{c}" opacity="0.8"/>
                    <polygon points="56,53 24,61 40,110 56,79" fill="{c}" opacity="0.85"/>
                    <polygon points="64,53 96,61 80,110 64,79" fill="{c}" opacity="0.7"/>
                </g>
            </svg>`,
            // 종이배
            `<svg viewBox="0 0 120 120">
                <g>
                    <polygon points="60,10 47,53 73,53" fill="{c}" opacity="0.8"/>
                    <polygon points="12,43 58,62 36,92" fill="{c}" opacity="0.9"/>
                    <polygon points="108,43 62,62 84,92" fill="{c}" opacity="0.75"/>
                    <polygon points="37,92 60,62 83,92" fill="{c}" opacity="1.0"/>
                </g>
            </svg>`,
            // 백조
            `<svg viewBox="0 0 120 120">
                <g>
                    <polygon points="11,21 30,14 28,26" fill="{c}" opacity="0.75"/>
                    <polygon points="30,14 38,21 28,26" fill="{c}" opacity="0.85"/>
                    <polygon points="28,26 38,21 38,95 31,95 12,68" fill="{c}" opacity="0.95"/>
                    <polygon points="12,68 31,95 31,58" fill="{c}" opacity="0.7"/>
                    <polygon points="36,54 94,15 86,39" fill="{c}" opacity="0.9"/>
                    <polygon points="86,39 94,15 110,33 80,95" fill="{c}" opacity="0.8"/>
                    <polygon points="33,57 94,15 81,96 40,96" fill="{c}" opacity="1.0"/>
                    <polygon points="81,96 118,50 85,95" fill="{c}" opacity="0.85"/>
                </g>
            </svg>`
        ];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // ==========================================
        // 2. 파티클 시스템
        // ==========================================
        function createParticles(x, y, color) {
            const particleCount = 35;
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 3;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 12 + 6,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.025 + 0.015,
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.3
                });
            }
        }

        function updateAndDrawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
                p.alpha -= p.decay;
                p.rotation += p.vRot;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = p.color;

                ctx.beginPath();
                ctx.moveTo(-p.size / 2, -p.size / 2);
                ctx.lineTo(p.size / 2, -p.size / 2);
                ctx.lineTo(0, p.size / 2);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        // ==========================================
        // 3. 종이 생성 및 로직
        // ==========================================
        function createPaper() {
            const randomSize = Math.floor(Math.random() * 230) + 220;
            const chosenColor = colorList[Math.floor(Math.random() * colorList.length)];
            const targetShapeIndex = Math.floor(Math.random() * finalOrigamiTemplates.length);

            const paperElement = document.createElement("div");
            paperElement.className = "origami-item";

            paperElement.style.width = randomSize + "px";
            paperElement.style.height = randomSize + "px";

            let x = Math.random() * (window.innerWidth - randomSize);
            let y = Math.random() * (window.innerHeight - randomSize);

            let baseVx = (Math.random() - 0.5) * 2;
            let baseVy = (Math.random() - 0.5) * 2;
            let angle = Math.random() * 360;
            let vAngle = (Math.random() - 0.5) * 0.8;

            let foldStep = 0;
            let isPaused = false;

            paperElement.innerHTML = `
                <svg viewBox="0 0 120 120">
                    <rect x="15" y="15" width="90" height="90" fill="${chosenColor}"/>
                </svg>
            `;

            stage.appendChild(paperElement);

            const paperData = {
                element: paperElement,
                x: x,
                y: y,
                vx: baseVx,
                vy: baseVy,
                angle: angle,
                vAngle: vAngle,
                color: chosenColor,
                size: randomSize,
                foldStep: foldStep,
                targetShapeIndex: targetShapeIndex,
                get isPaused() { return isPaused; }
            };

            paperElement.onclick = function(e) {
                if (paperData.foldStep < 3) {
                    paperData.foldStep++;
                    createParticles(e.clientX, e.clientY, paperData.color);

                    if (paperData.foldStep === 1) {
                        paperElement.innerHTML = `
                            <svg viewBox="0 0 120 120">
                                <g>
                                    <polygon points="15,15 105,15 15,105" fill="${chosenColor}" opacity="1"/>
                                    <polygon points="15,105 105,15 105,105" fill="${chosenColor}" opacity="0.7"/>
                                </g>
                            </svg>
                        `;
                    } else if (paperData.foldStep === 2) {
                        paperElement.innerHTML = `
                            <svg viewBox="0 0 120 120">
                                <g>
                                    <polygon points="60,10 105,60 60,60" fill="${chosenColor}" opacity="0.95"/>
                                    <polygon points="60,10 15,60 60,60" fill="${chosenColor}" opacity="0.75"/>
                                    <polygon points="60,60 105,60 60,110" fill="${chosenColor}" opacity="0.85"/>
                                    <polygon points="60,60 15,60 60,110" fill="${chosenColor}" opacity="1.0"/>
                                </g>
                            </svg>
                        `;
                    } else if (paperData.foldStep === 3) {
                        let template = finalOrigamiTemplates[paperData.targetShapeIndex];
                        paperElement.innerHTML = template.replace(/{c}/g, chosenColor);
                    }
                } else {
                    isPaused = !isPaused;
                    if (isPaused) {
                        paperElement.classList.add("paused");
                    } else {
                        paperElement.classList.remove("paused");
                    }
                    createParticles(e.clientX, e.clientY, paperData.color);
                }
            };

            paperList.push(paperData);
        }

        // ==========================================
        // 4. 애니메이션 물리 루프
        // ==========================================
        function animate() {
            const padding = 50;

            for (let paper of paperList) {
                if (!paper.isPaused) {
                    paper.x += paper.vx * globalSpeedMultiplier;
                    paper.y += paper.vy * globalSpeedMultiplier;
                    paper.angle += paper.vAngle * globalSpeedMultiplier;

                    let centerX = paper.x + paper.size / 2;
                    let centerY = paper.y + paper.size / 2;

                    let distX = centerX - mouse.x;
                    let distY = centerY - mouse.y;
                    let distance = Math.sqrt(distX * distX + distY * distY);

                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        let pushX = (distX / distance) * force * 12;
                        let pushY = (distY / distance) * force * 12;

                        paper.x += pushX;
                        paper.y += pushY;
                    }

                    if (paper.x < -padding) {
                        paper.x = -padding;
                        paper.vx *= -1;
                    } else if (paper.x > window.innerWidth - paper.size + padding) {
                        paper.x = window.innerWidth - paper.size + padding;
                        paper.vx *= -1;
                    }

                    if (paper.y < -padding) {
                        paper.y = -padding;
                        paper.vy *= -1;
                    } else if (paper.y > window.innerHeight - paper.size + padding) {
                        paper.y = window.innerHeight - paper.size + padding;
                        paper.vy *= -1;
                    }
                }

                paper.element.style.transform = `translate3d(${paper.x}px, ${paper.y}px, 0) rotate(${paper.angle}deg)`;
            }

            updateAndDrawParticles();
            requestAnimationFrame(animate);
        }

        // ==========================================
        // 5. 이벤트 핸들러
        // ==========================================
        speedSlider.addEventListener('input', (e) => {
            globalSpeedMultiplier = parseFloat(e.target.value);
            speedValDisplay.innerText = globalSpeedMultiplier.toFixed(1) + "x";
        });

        addPaperBtn.onclick = function() {
            createPaper();
        };

        createPaper();
        animate();
    </script>
</body>
</html>
